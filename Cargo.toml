[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/tokativ"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
tokativ-audio = { path = "crates/audio" }
tokativ-config = { path = "crates/config" }
tokativ-engine = { path = "crates/engine" }
tokativ-input = { path = "crates/input" }
tokativ-ui = { path = "crates/ui" }

anyhow = "1.0"
dirs = "6.0"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
# PulseAudio host for a list of the sound server's real sources. handy-cpal is cpal 0.18.2 with the
# one-line record stream fix from RustAudio/cpal#1387, which plain 0.18.2 lacks.
cpal = { package = "handy-cpal", version = "0.18.2", features = ["pulseaudio"] }
rtrb = "0.3"
rubato = "0.16"
rustfft = "6.4"
rustix = { version = "1", features = ["event", "fs"] }
serde_json = "1.0"
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"
futures = "0.3"
hound = "3.5"
gpui = { git = "https://github.com/sonorahq/gpui", rev = "439295d5c1e21682a704b93a6ade6a7d5a585ccd" }
gpui_platform = { git = "https://github.com/sonorahq/gpui", rev = "439295d5c1e21682a704b93a6ade6a7d5a585ccd", features = [
  "font-kit",
  "wayland",
] }
icons = { git = "https://github.com/sonorahq/sonora", rev = "2a68b53b" }
ui = { git = "https://github.com/sonorahq/sonora", rev = "2a68b53b" }
regex = "1.12"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "query", "rustls"] }
sha2 = "0.10"
# GGUF speech models through ggml, on the graphics card through Vulkan when there is one.
transcribe-cpp = { version = "0.4", default-features = false, features = ["vulkan"] }
clap = { version = "4.5", features = ["derive"] }
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
notify = "8.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# GPUI and the UI crate are too slow unoptimized to judge scrolling or animation by, so dev builds
# optimize every dependency and keep only this workspace's crates debuggable.
[profile.dev.package."*"]
debug = false
opt-level = 2
